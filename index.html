<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JARVIS AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>JARVIS</h1>
  <div id="output">Awaiting command...
    <br>
    Click the Glowing Circle 👇
  </div>
</div>
  <div>
  <button id="micBtn" class="mic-btn">
<div class="mic-btn-container">
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>
  <div class="ring ring-4"></div>
  <div class="ring ring-5"></div>
  <div class="ring ring-6"></div>
  <div class="ring ring-7"></div>
</div>
    </div>
  <div id="wakeWordAlert" class="wake-word-popup">⚠️ Please say "Jarvis" first to activate the AI!</div>

  <div id="vertical-date" class="side-info left"></div>
<div id="vertical-time" class="side-info right"></div>

<div class="dev-signature">Project JARVIS | Built by AAMIR AHMAD WANI</div>

  <div id="jarvis-status-board" style="position: fixed; top: 45px; background: rgba(0, 255, 255, 0.1); border: 1px solid #00ffff; padding: 15px; border-radius: 10px; font-family: 'Courier New', Courier, monospace; color: #00ffff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.3); z-index: 1000;">
    <h4 style="margin: 0 0 10px 0; border-bottom: 1px solid #00ffff;">SYSTEM STATUS</h4>
    <p style="margin: 5px 0;">CORE: <span id="core-status" style="color: #0f0;">ONLINE</span></p>
    <p style="margin: 5px 0;">LAST SYNC: <span id="sync-time">---</span></p>
    <p style="margin: 5px 0;">CURRENT GOAL: <span id="goal-display" style="font-size: 0.8em;"><marquee>Fetching...</marquee></span></p>
</div>
  
  <script src="script.js"></script>
</body>
</html>
